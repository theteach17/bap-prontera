<!DOCTYPE html><html lang="th"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><?!= include('stylesheet'); ?></head><body><header class="pn-topbar"><span class="pn-brand">PRONTERA · ROOM DISPLAY</span><span class="pn-top-spacer"></span><span id="displayTime" role="status"></span></header><main class="pn-main"><div class="pn-page-head"><h1>สถานะห้องประชุม</h1><p>ข้อมูลจากตารางจอง ไม่ใช่เซ็นเซอร์การใช้งานจริง · อัปเดตทุก 60 วินาที</p></div><div class="pn-personal-grid" id="displayRooms" aria-live="polite">กำลังโหลด...</div></main><script>
const states={FREE:'ว่างตามตาราง',RESERVED:'มีการจองอนุมัติแล้ว',PENDING:'มีคำขอกันห้อง',MAINTENANCE:'ปิดซ่อมบำรุง'};let busy=false;
function refreshDisplay(){if(busy||document.hidden)return;busy=true;const el=document.getElementById('displayRooms'),time=document.getElementById('displayTime'),fmt=v=>new Date(v).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});google.script.run.withSuccessHandler(data=>{busy=false;time.textContent='อัปเดต '+fmt(data.at);el.replaceChildren();data.rooms.forEach(r=>{const a=document.createElement('article');a.className='pn-request';for(const [tag,value] of [['h2',r.name],['h3',states[r.state]||'ไม่ทราบสถานะ'],['p','ความจุ '+r.capacity+' คน'],['p',r.until?'ถึง '+fmt(r.until):''],['p',r.next?'จองถัดไป '+fmt(r.next):'ไม่มีการจองถัดไปใน 24 ชั่วโมง']]){if(!value)continue;const e=document.createElement(tag);e.textContent=value;a.append(e);}el.append(a);});if(!data.rooms.length)el.textContent='ไม่มีห้องที่เปิดให้บริการ';}).withFailureHandler(()=>{busy=false;time.textContent='อัปเดตไม่สำเร็จ';el.textContent='ไม่สามารถอ่านสถานะล่าสุดได้ กรุณาใช้บัญชี Workspace และลองใหม่';}).getPronteraRoomDisplay();}
document.addEventListener('DOMContentLoaded',()=>{refreshDisplay();setInterval(refreshDisplay,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDisplay();});});
</script></body></html>
