<script>
/** Date-first single page booking. Canonical hidden values preserve legacy GAS contract. */
let pnExistingLayout=false,pnAvailGeneration=0,pnAvailTimer=0,pnLastStartDate='';
function pnResetBookingFields(){pnAvailGeneration++;clearTimeout(pnAvailTimer);pnLastStartDate='';pnEl('startTime').value='';pnEl('endTime').value='';pnEl('pnEndClock').setCustomValidity('');pnEl('pnAvailability').textContent='เลือกวันและเวลาเพื่อค้นหาห้องว่าง';pnEl('pnDateNote').textContent='เวลาไทย (UTC+7) · รองรับการใช้งานข้ามวัน';}
function pnSetBookingRange(start,end){pnEl('pnStartDate').value=String(start||'').slice(0,10);pnEl('pnStartClock').value=String(start||'').slice(11,16);pnEl('pnEndDate').value=String(end||'').slice(0,10);pnEl('pnEndClock').value=String(end||'').slice(11,16);pnLastStartDate=pnEl('pnStartDate').value;pnSyncBookingRange();pnScheduleAvailability();}
function pnSyncBookingRange(){
  const a=pnEl('pnStartDate'),b=pnEl('pnEndDate'),c=pnEl('pnStartClock'),d=pnEl('pnEndClock'),validClock=v=>/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(v);
  const start=a.value&&validClock(c.value)?a.value+'T'+c.value:'',end=b.value&&validClock(d.value)?b.value+'T'+d.value:'';
  pnEl('startTime').value=start;pnEl('endTime').value=end;
  const range=!!start&&!!end&&end>start;
  d.setCustomValidity(start&&end&&!range?'เวลาสิ้นสุดต้องอยู่หลังเวลาเริ่มต้น':'');
  const thaiDate=v=>new Date(v+'T00:00:00+07:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Bangkok'});
  pnEl('pnDateNote').textContent=start&&end&&!range?'กรุณาแก้ไขวันและเวลาสิ้นสุด':range?thaiDate(a.value)+' '+c.value+' – '+thaiDate(b.value)+' '+d.value+' น. (เวลาไทย)':'เวลาไทย (UTC+7) · รองรับการใช้งานข้ามวัน';
  return range;
}
function pnScheduleAvailability(){
  clearTimeout(pnAvailTimer);pnAvailGeneration++;
  const select=pnEl('roomId');for(const o of Array.from(select.options).slice(1)){o.disabled=false;o.textContent=o.dataset.name+' (รองรับ '+(o.dataset.capacity||'ไม่ระบุ')+' คน)';}
  if(pnEl('isEdit').value==='true'){pnEl('pnAvailability').textContent='แก้ไขรายการเดิม · ระบบตรวจห้องว่างอีกครั้งก่อนบันทึก';return;}
  if(!pnSyncBookingRange()){pnEl('pnAvailability').textContent='เลือกวันและเวลาเพื่อค้นหาห้องว่าง';return;}
  pnEl('pnAvailability').textContent='กำลังตรวจสอบห้องว่างตามช่วงเวลา...';pnAvailTimer=setTimeout(()=>pnFindAvailable(false),350);
}
async function pnFindAvailable(manual){
  clearTimeout(pnAvailTimer);const generation=++pnAvailGeneration,notice=pnEl('pnAvailability'),select=pnEl('roomId');
  if(pnEl('isEdit').value==='true'){notice.textContent='แก้ไขรายการเดิม · ระบบตรวจห้องว่างอีกครั้งก่อนบันทึก';return;}
  if(!pnSyncBookingRange()){notice.textContent='กรุณาเลือกวันและเวลาให้ครบถ้วน';return;}
  const count=Number(pnEl('headcount').value||1);if(!Number.isInteger(count)||count<1){notice.textContent='กรุณาระบุจำนวนผู้เข้าประชุมเป็นจำนวนเต็ม';return;}
  notice.textContent='กำลังตรวจสอบห้องว่าง...';
  try{const rooms=await pronteraRpc('getPronteraAvailableRooms',pnEl('startTime').value,pnEl('endTime').value,count);if(generation!==pnAvailGeneration)return;if(!Array.isArray(rooms))throw Error('รูปแบบข้อมูลห้องไม่ถูกต้อง');
    const available=new Set(rooms.map(r=>String(r.roomId)));for(const o of Array.from(select.options).slice(1)){o.disabled=!available.has(o.value);o.textContent=o.dataset.name+' (รองรับ '+(o.dataset.capacity||'ไม่ระบุ')+' คน) · '+(o.disabled?'ไม่พร้อม':'ว่าง');}
    if(select.value&&!available.has(select.value)){select.value='';updateRoomName();}
    notice.textContent=available.size?'พบ '+available.size+' ห้องว่าง'+(pnEl('headcount').value?'':' · ระบุจำนวนคนเพื่อกรองความจุ'):'ไม่พบห้องที่ว่างและรองรับจำนวนคนตามเงื่อนไข';
  }catch(e){if(generation!==pnAvailGeneration)return;for(const o of Array.from(select.options).slice(1)){o.disabled=false;o.textContent=o.dataset.name+' (รองรับ '+(o.dataset.capacity||'ไม่ระบุ')+' คน)';}notice.textContent='ยังตรวจสอบห้องว่างไม่ได้ กดตรวจสอบอีกครั้ง หรือเลือกห้องเพื่อให้ระบบตรวจสอบก่อนบันทึก';}
}
function pnValidateBookingFields(){
  pnSyncBookingRange();const form=pnEl('bookingForm');if(!form.reportValidity())return false;
  if(!pnEl('startTime').value||!pnEl('endTime').value||pnEl('endTime').value<=pnEl('startTime').value){pnEl('pnStartDate').focus();return false;}
  if(!pnEl('roomId').value||pnEl('roomId').selectedOptions[0]?.disabled){pnEl('pnAvailability').textContent='กรุณาเลือกห้องประชุมที่พร้อมใช้งาน';pnEl('roomId').focus();return false;}
  if(pnEl('isEdit').value!=='true'&&new Date(pnEl('startTime').value+'+07:00').getTime()<Date.now()-300000){pnEl('pnDateNote').textContent='ไม่สามารถจองย้อนหลังได้ กรุณาเลือกเวลาใหม่';pnEl('pnStartDate').focus();return false;}
  return true;
}
function pnInitBookingFields(){
  const date=pnEl('pnStartDate');date.addEventListener('change',()=>{const end=pnEl('pnEndDate');if(!end.value||end.value===pnLastStartDate||end.value<date.value)end.value=date.value;pnLastStartDate=date.value;if(date.value&&!pnEl('pnStartClock').value)pnEl('pnStartClock').value='09:00';if(date.value&&!pnEl('pnEndClock').value)pnEl('pnEndClock').value='10:00';pnScheduleAvailability();});
  for(const id of ['pnStartClock','pnEndClock','pnEndDate','headcount'])pnEl(id).addEventListener('input',()=>{if(id==='headcount')validateCapacityClient();pnScheduleAvailability();});
  pnEl('bookingModal').addEventListener('shown.bs.modal',()=>{pnScheduleAvailability();if(!pnEl('pnStartDate').value)pnEl('pnStartDate').focus();});
  pnEl('bookingModal').addEventListener('hidden.bs.modal',()=>{clearTimeout(pnAvailTimer);pnAvailGeneration++;});
}

/* Experience layer: routes, guided booking, personal pages and management metrics. */
let pnPersonalGeneration=0,pnProfileGeneration=0,pnAnalyticsGeneration=0;
const pnEl=id=>document.getElementById(id);
const pnLoading=()=>'<div class="pn-empty" role="status"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>กำลังโหลดข้อมูล...</div>';
function pnCloseMenu(){pnEl('pnNav').classList.remove('open');pnEl('pnMenu').setAttribute('aria-expanded','false');}
function pnShowView(view){
  if(!['calendar','bookings','inbox','profile','dashboard'].includes(view))return;
  if(view==='dashboard'&&(!currentUser||!['Admin','Officer'].includes(currentUser.role))){openLoginModal();return;}
  document.querySelectorAll('.pn-view').forEach(el=>el.hidden=el.id!=='pnView-'+view);
  document.querySelectorAll('[data-view]').forEach(el=>{const selected=el.dataset.view===view;el.classList.toggle('active',selected);if(selected)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
  pnCloseMenu();pnEl('pnMain').focus({preventScroll:true});window.scrollTo(0,0);
  if(view==='calendar'&&calendar)requestAnimationFrame(()=>calendar.updateSize());
  if(view==='bookings'||view==='inbox')pnLoadPersonal(view);
  if(view==='profile')pnLoadProfile();
  if(view==='dashboard'){loadDashboardData(false);pnLoadAnalytics();}
}
function pnRefreshRooms(rooms){
  pnEl('pnRoomCount').textContent=rooms.length;
  const select=pnEl('pnRoomFilter'),old=select.value;select.replaceChildren(new Option('ทุกห้อง',''));
  rooms.forEach(r=>select.add(new Option(r.roomName,r.roomId)));if(rooms.some(r=>String(r.roomId)===old))select.value=old;
}
function pnRequestMarkup(r,inbox){
  const step=Number(r.step),statuses=Array.isArray(r.timeline)?r.timeline:[], labels=['ผู้รับผิดชอบห้อง','งานอาคารสถานที่','รองผู้อำนวยการ'];
  const timeline=labels.map((label,i)=>{const state=statuses[i]||'';const done=state==='SIGNED',current=state==='PENDING';return `<span class="${done?'done':current?'current':''}">${done?'✓ ':current?'● ':''}${i+1}. ${label}</span>`;}).join('');
  const url=String(r.url||''),link=inbox&&/^https:\/\/script\.google\.com\//.test(url)?`<a class="btn btn-primary btn-sm mt-3" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">เปิดเอกสารเพื่อพิจารณา <i class="bi bi-arrow-up-right"></i></a>`:inbox?'<p class="small text-danger mt-3">ลิงก์หมดอายุ กรุณาติดต่อเจ้าหน้าที่</p>':'';
  return `<article class="pn-request"><small>${escapeHtml(r.id)}</small><h3>${escapeHtml(r.topic)}</h3><div>${escapeHtml(r.room)} · ${escapeHtml(r.start)}</div><div class="mt-2 fw-bold">${escapeHtml(r.status||'รอลงนามขั้นที่ '+step)}</div>${!inbox&&statuses.length?'<div class="pn-timeline" aria-label="สถานะการลงนาม">'+timeline+'</div>':''}${link}</article>`;
}
async function pnLoadPersonal(view){const target=pnEl(view==='inbox'?'pnInbox':'pnBookings'),generation=++pnPersonalGeneration;target.innerHTML=pnLoading();try{const rows=await pronteraRpc(view==='inbox'?'getPronteraApprovalInbox':'getPronteraMyBookings');if(generation!==pnPersonalGeneration)return;target.innerHTML=rows.length?rows.map(r=>pnRequestMarkup(r,view==='inbox')).join(''):'<div class="pn-empty">ยังไม่มีรายการ</div>';}catch(e){if(generation===pnPersonalGeneration)target.innerHTML='<div class="pn-empty">'+escapeHtml(e.message||e)+'</div>';}}
async function pnLoadProfile(){const generation=++pnProfileGeneration,el=pnEl('pnProfile');el.innerHTML=pnLoading();try{const p=await pronteraRpc('getPronteraSignatureProfile');if(generation!==pnProfileGeneration)return;el.innerHTML=`<h2>บัญชี Google Workspace</h2><p class="mt-2">${escapeHtml(p.email||'ยังไม่สามารถยืนยันบัญชี')}</p><hr><h2>ลายเซ็นส่วนบุคคล</h2><p class="mt-2">${!p.enabled?'ยังไม่ได้เปิดระบบลายเซ็น':!p.available?'ไม่สามารถยืนยันบัญชีได้':p.hasSignature?'พร้อมใช้งาน · เวอร์ชัน '+escapeHtml(p.version):'ยังไม่ได้สร้างลายเซ็น'}</p><small class="text-muted">การเปลี่ยนลายเซ็นจะไม่เปลี่ยนเอกสารที่ลงนามแล้ว</small>`;}catch(e){if(generation===pnProfileGeneration)el.innerHTML='<div class="pn-empty">'+escapeHtml(e.message||e)+'</div>';}}
async function pnLoadAnalytics(){const generation=++pnAnalyticsGeneration,el=pnEl('pnAnalytics');el.innerHTML=pnLoading();try{const a=await pronteraRpc('getPronteraAnalytics',getSessionToken());if(generation!==pnAnalyticsGeneration||!currentUser)return;const max=Math.max(1,...a.rooms.map(r=>r.hours));el.innerHTML=`<div class="pn-kpis mb-4"><div class="pn-kpi"><small>จำนวนการจอง</small><b>${a.count}</b></div><div class="pn-kpi"><small>ชั่วโมงจองในช่วงที่วัด</small><b>${a.hours}</b></div><div class="pn-kpi"><small>เวลาอนุมัติเฉลี่ย (ชม.)</small><b>${a.approvalHours===null?'—':a.approvalHours}</b><small>จาก ${a.approvalCount} Workflow</small></div></div>`+a.rooms.map(r=>`<div class="mb-3"><div class="d-flex justify-content-between gap-2"><b>${escapeHtml(r.name)}</b><span>${r.hours} ชม. · ${r.count} ครั้ง</span></div><div class="pn-bar-track" role="presentation"><div class="pn-bar" style="width:${Math.min(100,100*r.hours/max)}%"></div></div></div>`).join('')+'<p class="small text-muted">ชั่วโมงตามช่วงเวลาจอง ไม่ใช่หลักฐานการใช้ห้องจริง และไม่ใช่อัตราร้อยละของเวลาที่เปิดให้บริการ</p>';}catch(e){if(generation===pnAnalyticsGeneration)el.innerHTML='<div class="pn-empty">'+escapeHtml(e.message||e)+'</div>';}}
async function pnOpenMaintenance(){try{pronteraLoading('กำลังโหลดรายการปิดห้อง');const data=await pronteraRpc('getPronteraMaintenance',getSessionToken());if(!data.enabled){Swal.fire('ระบบปิดห้องยังไม่เปิด','ผู้ดูแลต้องเปิด Feature Flag หลังตรวจรับ','info');return;}const fmt=v=>new Date(v).toLocaleString('th-TH',{timeZone:'Asia/Bangkok'});const options=allRooms.map(r=>`<option value="${escapeAttr(r.roomId)}">${escapeHtml(r.roomName)}</option>`).join('');const result=await Swal.fire({title:'ปิดห้องซ่อมบำรุง',width:700,html:data.rows.map((r,i)=>`<div class="border rounded p-2 mb-2 text-start">${escapeHtml(r.room)} · ${escapeHtml(fmt(r.start))} – ${escapeHtml(fmt(r.end))}<br>${escapeHtml(r.reason)} <button type="button" class="btn btn-outline-danger btn-sm pn-release" data-index="${i}">ยกเลิกช่วงปิด</button></div>`).join('')+'<hr><div class="text-start"><label for="pnMaintRoom">ห้อง</label><select id="pnMaintRoom" class="form-select">'+options+'</select><label for="pnMaintStart" class="mt-2">เริ่ม (เวลาไทย)</label><input id="pnMaintStart" type="datetime-local" class="form-control"><label for="pnMaintEnd" class="mt-2">สิ้นสุด (เวลาไทย)</label><input id="pnMaintEnd" type="datetime-local" class="form-control"><label for="pnMaintReason" class="mt-2">เหตุผล</label><input id="pnMaintReason" class="form-control" maxlength="300"></div>',showCancelButton:true,confirmButtonText:'เพิ่มช่วงปิดห้อง',cancelButtonText:'ปิด',didOpen:()=>{document.querySelectorAll('.pn-release').forEach(btn=>btn.addEventListener('click',async()=>{const id=data.rows[Number(btn.dataset.index)].id;const c=await Swal.fire({title:'ยืนยันยกเลิกช่วงปิดห้อง?',icon:'warning',showCancelButton:true});if(c.isConfirmed){try{await pronteraRpc('cancelPronteraMaintenance',id,getSessionToken());await pnOpenMaintenance();}catch(e){pronteraError(e);}}}));},preConfirm:()=>{const f={roomId:pnEl('pnMaintRoom').value,start:pnEl('pnMaintStart').value,end:pnEl('pnMaintEnd').value,reason:pnEl('pnMaintReason').value.trim()};if(!f.roomId||!f.start||!f.end||f.end<=f.start||!f.reason){Swal.showValidationMessage('กรุณากรอกข้อมูลครบถ้วน');return false;}return f;}});if(result.isConfirmed){await pronteraRpc('createPronteraMaintenance',result.value,getSessionToken());await Swal.fire('บันทึกสำเร็จ','ระบบจะกันช่วงเวลานี้จากคำขอใหม่','success');}}catch(e){pronteraError(e);}}
async function pnOpenWorkerHealth(){try{const h=await pronteraRpc('getPronteraWorkerHealth',getSessionToken());const labels={QUEUED:'รอดำเนินการ',RUNNING:'กำลังทำงาน',RETRY:'รอลองใหม่',DONE:'สำเร็จ',FAILED:'ต้องตรวจสอบ',SUPERSEDED:'ยกเลิกตาม Workflow'};await Swal.fire({title:'สถานะ Worker สร้าง PDF',html:'<p>'+ (h.enabled?'เปิดใช้งาน':'ปิดใช้งาน')+'</p><p>Heartbeat: '+escapeHtml(h.heartbeat?new Date(h.heartbeat).toLocaleString('th-TH',{timeZone:'Asia/Bangkok'}):'ยังไม่มี')+'</p>'+Object.entries(labels).map(([k,v])=>'<div class="d-flex justify-content-between border-bottom py-2"><span>'+v+'</span><b>'+Number(h.counts[k]||0)+'</b></div>').join(''),confirmButtonText:'ปิด'});}catch(e){pronteraError(e);}}
async function pnOpenRoomDisplay(){try{const url=await pronteraRpc('getPronteraRoomDisplayUrl');if(!/^https:\/\/script\.google\.com\//.test(url))throw Error('URL ไม่ถูกต้อง');await Swal.fire({title:'จอแสดงสถานะห้อง',html:'<p>แสดงสถานะตามตารางจองและไม่เปิดเผยข้อมูลผู้จอง</p><a class="btn btn-primary" target="_blank" rel="noopener noreferrer" href="'+escapeAttr(url)+'">เปิดจอแสดงผล</a>',confirmButtonText:'ปิด'});}catch(e){pronteraError(e);}}
async function pnOpenRecurring(){try{const options=allRooms.map(r=>`<option value="${escapeAttr(r.roomId)}">${escapeHtml(r.roomName)}</option>`).join('');const f=await Swal.fire({title:'วางแผนจองรายสัปดาห์',html:'<div class="text-start"><p class="small">ค้นหาล่วงหน้า 2–12 สัปดาห์ แต่ละรายการต้องยืนยันการลงนามแยกกัน และยังไม่กันห้องจนกว่าจะบันทึก</p><label for="pnRecRoom">ห้อง</label><select class="form-select" id="pnRecRoom">'+options+'</select><label for="pnRecStart">เริ่มครั้งแรก (เวลาไทย)</label><input type="datetime-local" id="pnRecStart" class="form-control"><label for="pnRecEnd">สิ้นสุดครั้งแรก (เวลาไทย)</label><input type="datetime-local" id="pnRecEnd" class="form-control"><label for="pnRecPeople">จำนวนผู้เข้าประชุม</label><input type="number" id="pnRecPeople" min="1" class="form-control" value="1"><label for="pnRecCount">จำนวนสัปดาห์</label><input type="number" min="2" max="12" value="4" id="pnRecCount" class="form-control"></div>',showCancelButton:true,confirmButtonText:'ตรวจสอบช่วงเวลา',preConfirm:()=>{const v={roomId:pnEl('pnRecRoom').value,start:pnEl('pnRecStart').value,end:pnEl('pnRecEnd').value,headcount:pnEl('pnRecPeople').value,count:pnEl('pnRecCount').value};if(!v.roomId||!v.start||!v.end||v.end<=v.start||!v.headcount||Number(v.count)<2||Number(v.count)>12){Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบ');return false;}return v;}});if(!f.isConfirmed)return;pronteraLoading('ตรวจสอบช่วงเวลารายสัปดาห์');const rows=await pronteraRpc('getPronteraRecurringPlan',f.value);const room=f.value.roomId,people=f.value.headcount;const pick=await Swal.fire({title:'แผนรายสัปดาห์',html:rows.map((r,i)=>`<div class="border-bottom py-2 text-start"><b>${i+1}. ${escapeHtml(r.start)} – ${escapeHtml(r.end)}</b><br>${r.available?'ว่างตามข้อมูลล่าสุด':'ไม่ว่าง'}</div>`).join('')+'<p class="small text-muted mt-3">เลือกครั้งที่จะสร้างคำขอและลงนาม ข้อมูลนี้ไม่ใช่การยืนยันการจอง</p><select id="pnRecPick" class="form-select">'+rows.map((r,i)=>r.available?`<option value="${i}">ครั้งที่ ${i+1}</option>`:'').join('')+'</select>',showCancelButton:true,confirmButtonText:'สร้างคำขอครั้งที่เลือก',cancelButtonText:'ปิด',preConfirm:()=>{const v=pnEl('pnRecPick').value;if(v===''){Swal.showValidationMessage('ไม่มีช่วงว่าง');return false;}return Number(v);}});if(pick.isConfirmed){const r=rows[pick.value];if(!r||!r.available)return;openBookingModal(r.start);pnSetBookingRange(r.start,r.end);pnEl('roomId').value=room;pnEl('headcount').value=people;updateRoomName();pnFindAvailable(true);}}catch(e){pronteraError(e);}}
function pnInitAdmin(){const body=pnEl('adminModal').querySelector('.modal-body'),children=Array.from(body.children),nav=document.createElement('div');nav.className='pn-admin-nav';const groups=[['เอกสารและ Workflow',children.slice(0,1).concat(children.slice(2,3))],['การประเมิน',children.slice(1,2)],['ข้อมูลระบบ',children.slice(3)]];groups.forEach(([label,items],i)=>{const btn=document.createElement('button');btn.type='button';btn.className='btn btn-outline-primary btn-sm';btn.textContent=label;btn.addEventListener('click',()=>groups.forEach(([,els],j)=>{els.forEach(e=>e.hidden=j!==i);nav.children[j].classList.toggle('active',j===i);}));nav.append(btn);});body.prepend(nav);nav.firstElementChild.click();}
document.addEventListener('DOMContentLoaded',()=>{
  pnEl('pnMenu').addEventListener('click',()=>{const opened=pnEl('pnNav').classList.toggle('open');pnEl('pnMenu').setAttribute('aria-expanded',String(opened));});document.addEventListener('keydown',e=>{if(e.key==='Escape')pnCloseMenu();});
  pnEl('pnRoomFilter').addEventListener('change',()=>{if(calendar)calendar.refetchEvents();});
  pnInitBookingFields();
  pnInitAdmin();
});
</script>
