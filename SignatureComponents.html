<script>
/** Shared UI for verified signature profiles and Workspace-backed tools. */
function pronteraRpc(method,...args){
  return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[method](...args);});
}
function pronteraEsc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function pronteraError(error){Swal.fire('ไม่สามารถดำเนินการได้',String(error?.message||error||'เกิดข้อผิดพลาด'),'error');}
function pronteraLoading(title){Swal.fire({title,allowOutsideClick:false,allowEscapeKey:false,showConfirmButton:false,didOpen:()=>Swal.showLoading()});}
/** Draw or import an image and normalize to PNG with bounded dimensions. */
async function pronteraSignatureEditor(profile){
  let dirty=false, loading=false, readError='', draw=false, generation=0;
  const result=await Swal.fire({
    title:profile.hasSignature?'เปลี่ยนลายเซ็นส่วนบุคคล':'สร้างลายเซ็นส่วนบุคคล',
    html:`<div class="text-start small mb-2">บัญชี: <b>${pronteraEsc(profile.email)}</b><br>ลายเซ็นใหม่มีผลเฉพาะการลงนามครั้งถัดไป</div>
      <canvas id="pronteraCanvas" width="640" height="240" style="width:100%;max-width:640px;height:auto;border:1px solid #b6c2d1;border-radius:8px;background:white;touch-action:none" aria-label="พื้นที่วาดลายเซ็น"></canvas>
      <div class="d-flex gap-2 mt-2"><button type="button" id="pronteraClear" class="btn btn-outline-secondary btn-sm">ล้าง</button><label class="btn btn-outline-primary btn-sm">เลือกไฟล์ PNG/JPG<input type="file" id="pronteraImport" accept="image/png,image/jpeg" hidden></label></div><div id="pronteraImportStatus" class="small text-muted mt-2" role="status"></div>
      <label class="d-flex align-items-start gap-2 mt-3 text-start small"><input type="checkbox" id="pronteraConsent" class="form-check-input">ข้าพเจ้ายืนยันว่าลายเซ็นนี้เป็นของข้าพเจ้า และยินยอมให้จัดเก็บเพื่อใช้ลงนามเมื่อข้าพเจ้ายืนยันในแต่ละครั้ง</label>`,
    showCancelButton:true,confirmButtonText:'บันทึกลายเซ็น',cancelButtonText:'ยกเลิก',allowOutsideClick:false,
    didOpen:()=>{
      const c=document.getElementById('pronteraCanvas'),ctx=c.getContext('2d'),input=document.getElementById('pronteraImport'),status=document.getElementById('pronteraImportStatus');
      ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#102e54';
      const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};
      c.addEventListener('pointerdown',e=>{if(loading||e.button>0)return;e.preventDefault();draw=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e));});
      c.addEventListener('pointermove',e=>{if(!draw)return;e.preventDefault();ctx.lineTo(...pos(e));ctx.stroke();dirty=true;});
      ['pointerup','pointercancel','lostpointercapture'].forEach(event=>c.addEventListener(event,()=>{draw=false;}));
      document.getElementById('pronteraClear').onclick=()=>{generation++;loading=false;readError='';dirty=false;ctx.clearRect(0,0,c.width,c.height);input.value='';status.textContent='';};
      input.onchange=()=>{
        const f=input.files[0],current=++generation; if(!f)return;
        if(!['image/png','image/jpeg'].includes(f.type)||f.size>1048576){readError='กรุณาเลือก PNG/JPG ไม่เกิน 1 MB';status.textContent=readError;return;}
        loading=true;readError='';status.textContent='กำลังอ่านรูปภาพ';const url=URL.createObjectURL(f),image=new Image();
        image.onload=()=>{URL.revokeObjectURL(url);if(current!==generation)return;const scale=Math.min(c.width/image.width,c.height/image.height,1);if(!Number.isFinite(scale)||scale<=0){loading=false;readError='ภาพไม่ถูกต้อง';status.textContent=readError;return;}ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(image,(c.width-image.width*scale)/2,(c.height-image.height*scale)/2,image.width*scale,image.height*scale);dirty=true;loading=false;status.textContent='นำเข้าภาพแล้ว';};
        image.onerror=()=>{URL.revokeObjectURL(url);if(current===generation){loading=false;readError='อ่านภาพไม่สำเร็จ';status.textContent=readError;}};image.src=url;
      };
    },preConfirm:()=>{
      if(loading||readError||!dirty||!document.getElementById('pronteraConsent').checked){Swal.showValidationMessage(readError||'กรุณาวาดหรือเลือกภาพและยืนยันความยินยอมก่อนบันทึก');return false;}
      return document.getElementById('pronteraCanvas').toDataURL('image/png');
    }
  });
  if(!result.isConfirmed)return null;
  pronteraLoading('กำลังจัดเก็บลายเซ็น');
  try{const p=await pronteraRpc('savePronteraSignatureProfile',result.value,profile.signatureId||'',true);Swal.close();return p;}catch(e){Swal.close();throw e;}
}
async function pronteraOpenProfile(){
  try{
    pronteraLoading('กำลังตรวจสอบบัญชี');const profile=await pronteraRpc('getPronteraSignatureProfile');Swal.close();
    if(!profile.enabled){await Swal.fire('ลายเซ็นส่วนบุคคล',profile.available?'ตรวจสอบบัญชีสำเร็จ: '+profile.email+' — ยังไม่ได้เปิดใช้ลายเซ็นส่วนบุคคล':'ยังไม่ได้เปิดใช้ลายเซ็นส่วนบุคคล และไม่พบ Workspace Identity','info');return null;}
    if(!profile.available){await Swal.fire('ไม่สามารถยืนยันบัญชี','กรุณาเปิดระบบด้วยบัญชี Google Workspace ของโรงเรียน','warning');return null;}
    if(profile.hasSignature){const r=await Swal.fire({title:'ลายเซ็นส่วนบุคคล',html:`<div class="text-start">บัญชี: ${pronteraEsc(profile.email)}<br>สถานะ: พร้อมใช้งาน<br>เวอร์ชัน: ${pronteraEsc(profile.version)}</div>`,icon:'success',showCancelButton:true,confirmButtonText:'เปลี่ยนลายเซ็น',cancelButtonText:'ปิด'});if(!r.isConfirmed)return profile;}
    const saved=await pronteraSignatureEditor(profile);if(saved)await Swal.fire('บันทึกเรียบร้อย','ลายเซ็นเวอร์ชัน '+saved.version+' พร้อมใช้งาน','success');return saved;
  }catch(e){pronteraError(e);return null;}
}
/** Separate profile saving from explicit document-signing consent. */
async function pronteraChooseSignature(profile){
  let p=profile;
  if(!p.hasSignature){p=await pronteraSignatureEditor(p);if(!p)return null;}
  const r=await Swal.fire({title:'ยืนยันลงนามยื่นคำขอ',html:`<div class="text-start">ใช้ลายเซ็นส่วนบุคคล เวอร์ชัน ${pronteraEsc(p.version)}<br>บัญชี ${pronteraEsc(p.email)}<br>เมื่อยืนยัน ระบบจะนำลายเซ็นไปประทับในบันทึกข้อความฉบับนี้</div>`,icon:'question',showCancelButton:true,confirmButtonText:'ยืนยันและลงนาม',cancelButtonText:'กลับไปตรวจสอบ',allowOutsideClick:false});
  return r.isConfirmed?p:null;
}
async function pronteraFindRooms(){
  try{
    if(document.getElementById('isEdit').value==='true'){Swal.fire('ค้นหาห้องว่าง','สำหรับแก้ไขรายการเดิม กรุณาเลือกจากปฏิทิน','info');return;}
    const start=document.getElementById('startTime').value,end=document.getElementById('endTime').value,n=document.getElementById('headcount').value;
    if(!start||!end||!n){Swal.fire('กรุณาระบุข้อมูล','เลือกเวลาเริ่มต้น เวลาสิ้นสุด และจำนวนผู้เข้าประชุมก่อนค้นหา','info');return;}
    pronteraLoading('กำลังค้นหาห้องว่าง');const rooms=await pronteraRpc('getPronteraAvailableRooms',start,end,n);Swal.close();
    if(!rooms.length){Swal.fire('ไม่พบห้องว่าง','ลองเปลี่ยนช่วงเวลาหรือจำนวนผู้เข้าประชุม','info');return;}
    const options={};rooms.forEach(r=>{options[r.roomId]=r.roomName+' · '+(r.capacity||'ไม่ระบุ')+' คน'+(r.requireSetup?' · ต้องแนบผัง':'');});
    const result=await Swal.fire({title:'เลือกห้องว่าง',input:'select',inputOptions:options,inputPlaceholder:'เลือกห้อง',showCancelButton:true,confirmButtonText:'เลือกห้อง',cancelButtonText:'ยกเลิก',inputValidator:v=>!v?'กรุณาเลือกห้อง':''});
    if(result.isConfirmed){document.getElementById('roomId').value=result.value;updateRoomName();}
  }catch(e){pronteraError(e);}
}
async function pronteraWorkspaceLogin(){
  try{pronteraLoading('กำลังยืนยันบัญชี Workspace');const user=await pronteraRpc('loginPronteraWorkspace');currentUser=user;try{localStorage.setItem('mrbs_user',JSON.stringify(user));}catch(e){}updateUIState();const m=bootstrap.Modal.getInstance(document.getElementById('loginModal'));if(m)m.hide();await Swal.fire('เข้าสู่ระบบสำเร็จ',user.name,'success');loadDashboardData(false);}catch(e){pronteraError(e);}
}
function pronteraCards(rows,inbox){
  if(!rows.length)return '<p class="text-muted">ไม่มีรายการ</p>';
  return rows.map(r=>{const url=String(r.url||'');const link=inbox&&/^https:\/\/script\.google\.com\//.test(url)?`<a class="btn btn-primary btn-sm mt-2" href="${pronteraEsc(url)}" target="_blank" rel="noopener noreferrer">เปิดพิจารณา</a>`:inbox?'<div class="text-danger small">ลิงก์หมดอายุ กรุณาติดต่อเจ้าหน้าที่</div>':'';return `<div class="border rounded p-3 mb-2 text-start"><small class="text-muted">${pronteraEsc(r.id)}</small><div class="fw-bold">${pronteraEsc(r.topic)}</div><div class="small">${pronteraEsc(r.room)} · ${pronteraEsc(r.start)}</div><div class="small">${pronteraEsc(r.status||'ขั้นตอนที่ '+r.step)}${!inbox&&r.step?' · ขั้นตอน '+pronteraEsc(r.step):''}</div>${link}</div>`;}).join('');
}
async function pronteraOpenBookings(){try{pronteraLoading('กำลังโหลดคำขอ');const rows=await pronteraRpc('getPronteraMyBookings');await Swal.fire({title:'คำขอของฉัน',html:pronteraCards(rows,false),width:650,confirmButtonText:'ปิด'});}catch(e){pronteraError(e);}}
async function pronteraOpenInbox(){try{pronteraLoading('กำลังโหลดเอกสาร');const rows=await pronteraRpc('getPronteraApprovalInbox');await Swal.fire({title:'เอกสารรอลงนาม',html:pronteraCards(rows,true),width:650,confirmButtonText:'ปิด'});}catch(e){pronteraError(e);}}
const pronteraOpsLabels={WAITING_SETUP:'รอจัดเตรียม',IN_PROGRESS:'กำลังจัดเตรียม',READY:'พร้อมใช้งาน',COMPLETED:'เสร็จสิ้น'};
async function pronteraOpenOperations(){
  try{
    pronteraLoading('กำลังโหลดคิวจัดห้อง');const rows=await pronteraRpc('getPronteraRoomOperations',getSessionToken());Swal.close();
    if(!rows.length){Swal.fire('คิวจัดเตรียมห้อง','ไม่มีรายการอนุมัติในช่วงเวลาที่แสดง','info');return;}
    const result=await Swal.fire({title:'คิวจัดเตรียมห้อง',width:760,html:'<div class="small text-muted mb-2">รายการอนุมัติแล้ว ช่วงเมื่อวานถึง 7 วันข้างหน้า (สูงสุด 100 รายการ)</div>'+rows.map((r,i)=>`<div class="border rounded p-3 mb-2 text-start"><div class="fw-bold">${pronteraEsc(r.room)} · ${pronteraEsc(r.topic)}</div><div class="small">${pronteraEsc(r.start)} · ${pronteraEsc(r.headcount)} คน</div><div class="small">${pronteraEsc(r.setupDetails||'ไม่มีรายละเอียดเพิ่มเติม')}</div>${r.layoutUrl&&/^https:\/\/drive\.google\.com\//.test(r.layoutUrl)?`<a href="${pronteraEsc(r.layoutUrl)}" target="_blank" rel="noopener noreferrer">เปิดผัง</a>`:''}<div class="mt-2"><label class="small" for="pronteraOps${i}">สถานะการจัดห้อง</label><select id="pronteraOps${i}" class="form-select form-select-sm">${Object.entries(pronteraOpsLabels).map(([k,v])=>`<option value="${k}" ${r.state===k?'selected':''}>${v}</option>`).join('')}</select></div></div>`).join(''),showCancelButton:true,confirmButtonText:'บันทึกสถานะที่เปลี่ยน',cancelButtonText:'ปิด',preConfirm:()=>rows.map((r,i)=>({...r,next:document.getElementById('pronteraOps'+i).value})).filter(r=>r.state!==r.next)});
    if(!result.isConfirmed)return;const changes=result.value||[];if(!changes.length)return;
    pronteraLoading('กำลังบันทึกสถานะ');let saved=0;try{for(const r of changes){await pronteraRpc('setPronteraRoomOperation',r.id,r.revision,r.state,r.next,getSessionToken());saved++;}}catch(e){throw Error('บันทึกแล้ว '+saved+' จาก '+changes.length+' รายการ: '+(e.message||e));}Swal.fire('บันทึกแล้ว',saved+' รายการ','success');
  }catch(e){pronteraError(e);}
}
async function pronteraOpenHealth(){
  try{pronteraLoading('กำลังตรวจสอบข้อมูล');const h=await pronteraRpc('getPronteraSystemHealth',getSessionToken());const labels={bookingCount:'รายการจองทั้งหมด',approvalError:'รายการต้องตรวจสอบ Workflow',duplicateBookingIds:'รหัสจองซ้ำ',multiplePendingFlows:'รายการที่มี Workflow ค้างซ้ำ',orphanFlows:'Workflow ที่ไม่พบ Booking',orphanSteps:'ขั้นลงนามที่ไม่พบ Workflow',expiredPendingTokens:'ลิงก์รอลงนามหมดอายุ'};await Swal.fire({title:'ตรวจสุขภาพข้อมูล',html:Object.entries(labels).map(([k,v])=>`<div class="d-flex justify-content-between border-bottom py-2 small"><span>${v}</span><b>${pronteraEsc(h[k])}</b></div>`).join('')+'<p class="small text-muted mt-3">ผลตรวจเชิงโครงสร้าง ไม่ได้ทดสอบ PDF, อีเมลหรือ Trigger จริง</p>',confirmButtonText:'ปิด'});}catch(e){pronteraError(e);}
}
</script>
